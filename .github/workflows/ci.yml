name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_DISABLE_METRICS: "1"
  # Pinned by docs/adr/003-qt-acquisition.md. Keep in step with
  # scripts/install_qt.ps1 -- the two are the same pin in two places.
  RF_QT_VERSION: "6.10.3"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 Debug
            os: windows-2022
            preset: windows-debug
          - name: Windows x64 Release
            os: windows-2022
            preset: windows-release
          - name: Linux x64 Debug
            os: ubuntu-24.04
            preset: linux-debug
          - name: Linux x64 Release
            os: ubuntu-24.04
            preset: linux-release
          - name: Linux ASan+UBSan
            os: ubuntu-24.04
            preset: linux-asan
          - name: Linux TSan
            os: ubuntu-24.04
            preset: linux-tsan

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang lld
          # FFmpeg assembles its x86 SIMD with nasm and probes dependencies with
          # pkg-config; vcpkg does not vendor either on Linux and fails the port
          # build outright if they are missing.
          sudo apt-get install -y nasm pkg-config
          # Qt 6 Widgets links these even when only the offscreen platform is used.
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libvulkan-dev

      # Official Qt binaries, fetched without a Qt account. See ADR 003 for why
      # Qt is not in the vcpkg manifest.
      - name: Install Qt ${{ env.RF_QT_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GITHUB_WORKSPACE:?workspace path is required before deleting anything under it}"

          python3 -m pip install --upgrade aqtinstall

          if [ "$RUNNER_OS" = "Windows" ]; then
            host=windows; arch=win64_msvc2022_64; subdir=msvc2022_64
            # cygpath keeps the path free of mixed separators; aqt is a native
            # Windows Python and does not want a bash-style path.
            qt_prefix="$(cygpath -m "$GITHUB_WORKSPACE")/Qt"
          else
            host=linux;   arch=linux_gcc_64;      subdir=gcc_64
            qt_prefix="$GITHUB_WORKSPACE/Qt"
          fi

          # aqtinstall extracts Qt's archives with py7zr and fails
          # intermittently part-way through: observed as
          #   py7zr.exceptions.Bad7zFile: Specified path is bad:
          #     lib/cmake/Qt6Gui/Qt6QWebpPluginTargets-relwithdebinfo.cmake
          # on one runner while the identical step succeeded on another in the
          # same workflow run. A half-extracted tree is not resumable, so every
          # attempt starts from a clean directory.
          for attempt in 1 2 3; do
            rm -rf "$qt_prefix"
            if python3 -m aqt install-qt "$host" desktop "$RF_QT_VERSION" "$arch" \
                 -m qtshadertools qtimageformats -O "$qt_prefix"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "aqt install-qt failed on all 3 attempts" >&2
              exit 1
            fi
            echo "aqt install-qt failed (attempt $attempt of 3), retrying" >&2
            sleep $((attempt * 15))
          done

          qt_root="$qt_prefix/$RF_QT_VERSION/$subdir"
          if [ ! -f "$qt_root/lib/cmake/Qt6/Qt6Config.cmake" ]; then
            echo "aqt reported success but Qt6Config.cmake is missing under $qt_root" >&2
            exit 1
          fi
          echo "QT_ROOT=$qt_root" >> "$GITHUB_ENV"

      - name: Read vcpkg baseline from manifest
        id: vcpkg_baseline
        shell: bash
        run: echo "sha=$(python3 -c "import json;print(json.load(open('vcpkg.json'))['builtin-baseline'])")" >> "$GITHUB_OUTPUT"

      # Checked out at the exact commit the manifest pins, so CI resolves the
      # same dependency versions a developer machine does.
      - name: Checkout vcpkg
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.vcpkg_baseline.outputs.sha }}
          path: vcpkg

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Bootstrap vcpkg (Linux)
        if: runner.os == 'Linux'
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Set VCPKG_ROOT
        shell: bash
        run: echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> "$GITHUB_ENV"

      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && 'C:\Users\runneradmin\AppData\Local\vcpkg\archives' || '~/.cache/vcpkg/archives' }}
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.os }}-

      - name: Enable MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build build/${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # Proves the produced binaries actually run on the target OS, which a
      # successful link does not. The GUI shell is started under the offscreen
      # platform so it exercises real widget creation with no display server.
      - name: Smoke run (headless tool)
        run: ./build/${{ matrix.preset }}/bin/rf_version
        shell: bash

      # Accuracy regression check on every commit. Runs only on the optimised
      # builds: sanitizer and debug configurations are several times slower and
      # would make the latency ceiling meaningless.
      #
      # This proves seek ACCURACY, not the 150 ms 4K budget -- the committed
      # fixtures are 320x240 and the real target needs a 2.9 GB source that
      # cannot live in CI. The budget below is a loose ceiling that catches an
      # order-of-magnitude regression, nothing finer. Frame-copy regressions are
      # caught deterministically by the SeekCost tests instead, which count
      # copies rather than milliseconds. See defect D9 in docs/BACKLOG.md.
      - name: Seek accuracy check
        if: endsWith(matrix.preset, 'release')
        shell: bash
        run: |
          for f in bars_320x240_30fps_h264_aac.mp4 bars_320x240_2997fps_h264.mp4; do
            ./build/${{ matrix.preset }}/bin/rf_seek_check \
              "tests/fixtures/media/$f" --seeks 300 --budget-ms 250
          done

      - name: Smoke run (application shell)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./build/${{ matrix.preset }}/bin/reelforge &
          pid=$!
          sleep 5
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "reelforge exited before the timeout"
            wait "$pid"
            exit 1
          fi
          kill "$pid"
