name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_DISABLE_METRICS: "1"
  # Pinned by docs/adr/003-qt-acquisition.md. Keep in step with
  # scripts/install_qt.ps1 -- the two are the same pin in two places.
  RF_QT_VERSION: "6.10.3"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 Debug
            os: windows-2022
            preset: windows-debug
          - name: Windows x64 Release
            os: windows-2022
            preset: windows-release
          - name: Linux x64 Debug
            os: ubuntu-24.04
            preset: linux-debug
          - name: Linux x64 Release
            os: ubuntu-24.04
            preset: linux-release
          - name: Linux ASan+UBSan
            os: ubuntu-24.04
            preset: linux-asan
          - name: Linux TSan
            os: ubuntu-24.04
            preset: linux-tsan

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang lld
          # Qt 6 Widgets links these even when only the offscreen platform is used.
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libvulkan-dev

      # Official Qt binaries, fetched without a Qt account. See ADR 003 for why
      # Qt is not in the vcpkg manifest.
      - name: Install Qt ${{ env.RF_QT_VERSION }}
        shell: bash
        run: |
          python3 -m pip install --upgrade aqtinstall
          if [ "$RUNNER_OS" = "Windows" ]; then
            host=windows; arch=win64_msvc2022_64; subdir=msvc2022_64
          else
            host=linux;   arch=linux_gcc_64;      subdir=gcc_64
          fi
          python3 -m aqt install-qt "$host" desktop "$RF_QT_VERSION" "$arch" \
            -m qtshadertools qtimageformats -O "$GITHUB_WORKSPACE/Qt"
          echo "QT_ROOT=$GITHUB_WORKSPACE/Qt/$RF_QT_VERSION/$subdir" >> "$GITHUB_ENV"

      - name: Read vcpkg baseline from manifest
        id: vcpkg_baseline
        shell: bash
        run: echo "sha=$(python3 -c "import json;print(json.load(open('vcpkg.json'))['builtin-baseline'])")" >> "$GITHUB_OUTPUT"

      # Checked out at the exact commit the manifest pins, so CI resolves the
      # same dependency versions a developer machine does.
      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.vcpkg_baseline.outputs.sha }}
          path: vcpkg

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Bootstrap vcpkg (Linux)
        if: runner.os == 'Linux'
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Set VCPKG_ROOT
        shell: bash
        run: echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> "$GITHUB_ENV"

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && 'C:\Users\runneradmin\AppData\Local\vcpkg\archives' || '~/.cache/vcpkg/archives' }}
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.os }}-

      - name: Enable MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build build/${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # Proves the produced binaries actually run on the target OS, which a
      # successful link does not. The GUI shell is started under the offscreen
      # platform so it exercises real widget creation with no display server.
      - name: Smoke run (headless tool)
        run: ./build/${{ matrix.preset }}/bin/rf_version
        shell: bash

      - name: Smoke run (application shell)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./build/${{ matrix.preset }}/bin/reelforge &
          pid=$!
          sleep 5
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "reelforge exited before the timeout"
            wait "$pid"
            exit 1
          fi
          kill "$pid"
